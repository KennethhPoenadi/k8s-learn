apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sikp
data:
  APP_NAME: "SiKP API"
  APP_ENV: "development"
  APP_PORT: "18080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "sikp_dev"
  DB_SSLMODE: "disable"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_BUCKET: "sikp-uploads"
  MINIO_USE_SSL: "false"
